# Nginx configuration for AbyFlow on AWS EC2

# Upstream Gunicorn/Flask container
upstream abyflow_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

# HTTP - Redirect to HTTPS and serve ACME challenge for Certbot
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN_OR_EC2_PUBLIC_IP;

    # Let's Encrypt challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS (uncomment when SSL certificate is generated)
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # Before SSL is configured, proxy directly via HTTP:
    location / {
        proxy_pass http://abyflow_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }
}

